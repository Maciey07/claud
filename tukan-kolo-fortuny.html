<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎡 Koło Integracji — Poznaj Swój Zespół!</title>
<style>
@font-face {
  font-family: 'Axiforma';
  src: url('https://cdn.jsdelivr.net/gh/nicholasgillespie/fonts@main/axiforma/Axiforma-Regular.woff2') format('woff2');
  font-weight: 400; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Axiforma';
  src: url('https://cdn.jsdelivr.net/gh/nicholasgillespie/fonts@main/axiforma/Axiforma-Medium.woff2') format('woff2');
  font-weight: 500; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Axiforma';
  src: url('https://cdn.jsdelivr.net/gh/nicholasgillespie/fonts@main/axiforma/Axiforma-SemiBold.woff2') format('woff2');
  font-weight: 600; font-style: normal; font-display: swap;
}
@font-face {
  font-family: 'Axiforma';
  src: url('https://cdn.jsdelivr.net/gh/nicholasgillespie/fonts@main/axiforma/Axiforma-Bold.woff2') format('woff2');
  font-weight: 700; font-style: normal; font-display: swap;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0e17;
  --surface: #1a1929;
  --card: #222139;
  --accent1: #ff6b6b;
  --accent2: #feca57;
  --accent3: #48dbfb;
  --accent4: #ff9ff3;
  --accent5: #54a0ff;
  --accent6: #5f27cd;
  --accent7: #01a3a4;
  --accent8: #f368e0;
  --text: #fffffe;
  --text-dim: #a7a9be;
}

html { font-size: 16px; }

body {
  font-family: 'Axiforma', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(255,107,107,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(84,160,255,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(254,202,87,0.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}

.app { position: relative; z-index: 1; }

.header { text-align: center; padding: 2rem 1rem 1rem; }

.header h1 {
  font-family: 'Axiforma', sans-serif;
  font-size: clamp(2rem, 5vw, 3.2rem);
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent1), var(--accent2), var(--accent4));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: -0.02em; line-height: 1.2;
}

.header p { color: var(--text-dim); margin-top: 0.4rem; font-size: 1.05rem; font-weight: 400; }

.setup-screen, .game-screen { max-width: 900px; margin: 0 auto; padding: 1rem 1.5rem 3rem; }

.setup-card {
  background: var(--surface); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 1.2rem; padding: 2rem; margin-top: 1rem;
}

.setup-card h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 1.2rem; color: var(--accent2); }

.player-input-row { display: flex; gap: 0.7rem; margin-bottom: 1rem; }

.player-input-row input {
  flex: 1; padding: 0.8rem 1rem; border-radius: 0.8rem;
  border: 2px solid rgba(255,255,255,0.08); background: var(--card);
  color: var(--text); font-family: 'Axiforma', sans-serif; font-size: 1rem;
  outline: none; transition: border-color 0.3s;
}
.player-input-row input:focus { border-color: var(--accent3); }
.player-input-row input::placeholder { color: var(--text-dim); opacity: 0.5; }

.btn {
  padding: 0.8rem 1.6rem; border-radius: 0.8rem; border: none;
  font-family: 'Axiforma', sans-serif; font-size: 1rem; font-weight: 600;
  cursor: pointer; transition: all 0.25s; display: inline-flex; align-items: center; gap: 0.4rem;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-add { background: var(--accent3); color: var(--bg); }

.btn-start {
  background: linear-gradient(135deg, var(--accent1), var(--accent4)); color: #fff;
  font-size: 1.15rem; padding: 1rem 2.5rem; border-radius: 1rem;
  margin-top: 1.5rem; display: block; width: 100%;
}
.btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.players-list { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; }

.player-tag {
  background: var(--card); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 2rem; padding: 0.45rem 1rem; font-size: 0.9rem;
  display: flex; align-items: center; gap: 0.5rem;
  animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.player-tag .remove { cursor: pointer; opacity: 0.4; transition: opacity 0.2s; font-size: 1.1rem; line-height: 1; }
.player-tag .remove:hover { opacity: 1; color: var(--accent1); }

@keyframes popIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.game-screen { text-align: center; }

.turn-info { font-size: 1.3rem; font-weight: 500; margin-bottom: 1rem; color: var(--text-dim); }
.turn-info span { color: var(--accent2); font-weight: 700; }

.wheel-area {
  position: relative; width: min(440px, 88vw); height: min(440px, 88vw); margin: 0 auto 1.5rem;
}
.wheel-container { width: 100%; height: 100%; position: relative; }

canvas#wheel {
  width: 100%; height: 100%; border-radius: 50%;
  filter: drop-shadow(0 0 30px rgba(255,107,107,0.15)); transition: filter 0.3s;
}
canvas#wheel.spinning { filter: drop-shadow(0 0 50px rgba(254,202,87,0.3)); }

.wheel-pointer {
  position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 18px solid transparent; border-right: 18px solid transparent;
  border-top: 36px solid var(--accent2);
  filter: drop-shadow(0 4px 12px rgba(254,202,87,0.5)); z-index: 10;
}
.wheel-pointer.bounce { animation: pointerBounce 0.15s ease; }

@keyframes pointerBounce {
  0%, 100% { transform: translateX(-50%) scaleY(1); }
  50% { transform: translateX(-50%) scaleY(0.8); }
}

.wheel-center {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 72px; height: 72px; border-radius: 50%; background: var(--bg);
  border: 4px solid var(--accent2); display: flex; align-items: center;
  justify-content: center; font-size: 1.8rem; z-index: 5; cursor: pointer;
  transition: all 0.3s; box-shadow: 0 0 20px rgba(254,202,87,0.2);
}
.wheel-center:hover { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 30px rgba(254,202,87,0.4); }
.wheel-center.disabled { pointer-events: none; opacity: 0.5; }

.btn-spin {
  background: linear-gradient(135deg, var(--accent2), var(--accent1)); color: var(--bg);
  font-size: 1.2rem; padding: 1rem 3rem; border-radius: 1rem; margin: 0.5rem auto;
}
.btn-spin:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15,14,23,0.85); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.4s; padding: 1rem;
}
.modal-overlay.active { opacity: 1; pointer-events: all; }

.modal {
  background: var(--surface); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 1.5rem; padding: 2.5rem 2rem 2rem; max-width: 520px; width: 100%;
  text-align: center; transform: scale(0.85) translateY(30px);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; overflow: hidden;
}
.modal-overlay.active .modal { transform: scale(1) translateY(0); }

.modal-category {
  font-size: 0.9rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.6rem;
}
.modal-emoji { font-size: 3rem; margin-bottom: 0.8rem; display: block; animation: float 3s ease-in-out infinite; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

.modal-question { font-size: 1.3rem; font-weight: 500; line-height: 1.4; margin-bottom: 1.8rem; color: var(--text); }
.modal-player { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 1.5rem; }
.modal-player strong { color: var(--accent2); }
.btn-next { background: var(--accent3); color: var(--bg); font-size: 1.05rem; padding: 0.9rem 2.5rem; border-radius: 0.8rem; }

.scoreboard { margin-top: 2rem; text-align: left; }
.scoreboard h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-dim); margin-bottom: 0.8rem; text-align: center; }

.score-row {
  display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 1rem;
  border-radius: 0.8rem; margin-bottom: 0.4rem; background: var(--card);
  border: 1px solid rgba(255,255,255,0.04); transition: all 0.3s;
}
.score-row.active-player { border-color: var(--accent2); background: rgba(254,202,87,0.08); }

.score-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; font-weight: 700; color: var(--bg); flex-shrink: 0;
}
.score-name { flex: 1; font-weight: 500; }
.score-count { color: var(--text-dim); font-size: 0.85rem; }

.confetti-piece {
  position: fixed; width: 10px; height: 10px; z-index: 200;
  pointer-events: none; animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

@media (max-width: 600px) {
  .setup-card { padding: 1.2rem; }
  .modal { padding: 1.8rem 1.2rem 1.5rem; }
  .wheel-center { width: 55px; height: 55px; font-size: 1.4rem; }
}

/* ─── Logo ─── */
.logo-area {
  margin-bottom: 0.8rem;
}
.logo {
  width: 64px; height: 64px;
  filter: drop-shadow(0 0 18px rgba(217,50,137,0.35));
  animation: logoPulse 4s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { filter: drop-shadow(0 0 18px rgba(217,50,137,0.35)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 28px rgba(250,232,0,0.4)); transform: scale(1.05); }
}

/* ─── Reset Button ─── */
.btn-reset {
  background: transparent;
  border: 2px solid rgba(255,255,255,0.12);
  color: var(--text-dim);
  font-size: 0.9rem;
  padding: 0.7rem 1.8rem;
  border-radius: 0.8rem;
  margin-top: 1.5rem;
  display: block;
  width: 100%;
  transition: all 0.3s;
}
.btn-reset:hover {
  border-color: var(--accent1);
  color: var(--accent1);
  background: rgba(255,107,107,0.06);
}

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo-area">

    </div>
    <button class="btn btn-start" id="startGameBtn" disabled>🚀 Rozpocznij grę!</button>
  </div>

  <div class="game-screen hidden" id="gameScreen">
    <div class="turn-info">Kolej gracza: <span id="currentPlayerName">—</span></div>
    <div class="wheel-area">
      <div class="wheel-pointer" id="pointer"></div>
      <div class="wheel-container">

      </div>
      <div class="wheel-center" id="spinCenterBtn">▶</div>
    </div>
    <button class="btn btn-spin" id="spinBtn">🎰 Kręć kołem!</button>
    <div class="scoreboard" id="scoreboard">
      <h3>📊 Odpowiedzi</h3>
      <div id="scoreRows"></div>
    </div>
    <button class="btn btn-reset" id="resetBtn">🔄 Resetuj grę</button>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal" id="modalCard">
      <span class="modal-emoji" id="modalEmoji">🎉</span>
      <div class="modal-category" id="modalCategory">Kategoria</div>

      <button class="btn btn-next" id="modalNextBtn">✅ Następna tura</button>
    </div>
  </div>
</div>

let players = [];
let currentPlayerIdx = 0;
let answeredCount = {};
let usedQuestions = {};
let isSpinning = false;
let currentAngle = 0;

const playerColors = ['#ff6b6b','#feca57','#48dbfb','#ff9ff3','#54a0ff','#5f27cd','#01a3a4','#f368e0','#10ac84','#ee5a24'];

const setupScreen = document.getElementById('setupScreen');
const gameScreen = document.getElementById('gameScreen');
const playerNameInput = document.getElementById('playerNameInput');
const addPlayerBtn = document.getElementById('addPlayerBtn');
const playersList = document.getElementById('playersList');
const startGameBtn = document.getElementById('startGameBtn');
const spinBtn = document.getElementById('spinBtn');
const spinCenterBtn = document.getElementById('spinCenterBtn');
const currentPlayerName = document.getElementById('currentPlayerName');
const scoreRows = document.getElementById('scoreRows');
const modal = document.getElementById('modal');
const modalCard = document.getElementById('modalCard');
const modalEmoji = document.getElementById('modalEmoji');
const modalCategory = document.getElementById('modalCategory');
const modalQuestion = document.getElementById('modalQuestion');
const modalPlayer = document.getElementById('modalPlayer');
const modalNextBtn = document.getElementById('modalNextBtn');
const pointer = document.getElementById('pointer');
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const resetBtn = document.getElementById('resetBtn');

// ── RESET GAME ──
function resetGame() {
  players = [];
  currentPlayerIdx = 0;
  answeredCount = {};
  usedQuestions = {};
  isSpinning = false;
  currentAngle = 0;
  playersList.innerHTML = '';
  playerNameInput.value = '';
  startGameBtn.disabled = true;
  spinBtn.disabled = false;
  spinCenterBtn.classList.remove('disabled');
  gameScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
}

resetBtn.addEventListener('click', resetGame);

// ── SETUP ──
function addPlayer() {
  const name = playerNameInput.value.trim();
  if (!name || players.includes(name)) { playerNameInput.value = ''; return; }
  if (players.length >= 10) return;
  players.push(name);
  renderPlayers();
  playerNameInput.value = '';
  playerNameInput.focus();
  startGameBtn.disabled = players.length < 2;
}

function removePlayer(idx) {
  players.splice(idx, 1);
  renderPlayers();
  startGameBtn.disabled = players.length < 2;
}

function renderPlayers() {
  playersList.innerHTML = players.map((p, i) =>
    `<div class="player-tag" style="border-color:${playerColors[i % playerColors.length]}40">
      <span style="color:${playerColors[i % playerColors.length]}">${p}</span>
      <span class="remove" onclick="removePlayer(${i})">✕</span>
    </div>`
  ).join('');
}

addPlayerBtn.addEventListener('click', addPlayer);
playerNameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

startGameBtn.addEventListener('click', () => {
  if (players.length < 2) return;
  players.forEach(p => { answeredCount[p] = 0; });
  CATEGORIES.forEach(c => { usedQuestions[c.name] = []; });
  setupScreen.classList.add('hidden');
  gameScreen.classList.remove('hidden');
  updateTurnInfo();
  renderScoreboard();
  drawWheel(0);
});

// ══════════════════════════════════════════
//  WHEEL DRAWING — curved text, high contrast
// ══════════════════════════════════════════
function drawWheel(rotation) {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const cx = size / 2, cy = size / 2, r = size / 2 - 6;
  const n = CATEGORIES.length;
  const arc = (Math.PI * 2) / n;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  for (let i = 0; i < n; i++) {
    const start = i * arc - Math.PI / 2;
    const end = start + arc;
    const cat = CATEGORIES[i];

    // Segment fill
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, start, end);
    ctx.closePath();
    ctx.fillStyle = cat.color;
    ctx.fill();

    // Depth gradient
    const grad = ctx.createRadialGradient(0, 0, r * 0.12, 0, 0, r);
    grad.addColorStop(0, 'rgba(0,0,0,0.22)');
    grad.addColorStop(0.45, 'rgba(0,0,0,0.04)');
    grad.addColorStop(1, 'rgba(255,255,255,0.1)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Segment border
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, start, end);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // ── TEXT along middle of segment ──
    ctx.save();
    const midAngle = start + arc / 2;
    ctx.rotate(midAngle);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Emoji — outer
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 4;
    ctx.font = `${Math.max(18, size * 0.055)}px sans-serif`;
    ctx.fillText(cat.emoji, r * 0.78, 0);

    // Category name — with dark backing pill for readability
    const nameR = r * 0.50;
    const fontSize = Math.max(12, size * 0.034);
    ctx.font = `700 ${fontSize}px 'Axiforma', sans-serif`;
    const textWidth = ctx.measureText(cat.name).width;

    // Dark pill background behind text
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    const pillW = textWidth + 14;
    const pillH = fontSize + 8;
    ctx.beginPath();
    const pr = pillH / 2;
    ctx.roundRect(nameR - pillW / 2, -pillH / 2, pillW, pillH, pr);
    ctx.fill();

    // Text stroke + fill for maximum contrast
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 5;
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.strokeText(cat.name, nameR, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(cat.name, nameR, 1);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Outer ring
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 5;
  ctx.stroke();

  // Notches
  for (let i = 0; i < n * 3; i++) {
    const angle = (i / (n * 3)) * Math.PI * 2;
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.arc(r - 1, 0, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

// ══════════════════════════════════════════
//  SPINNING — arrow ALWAYS lands inside segment
// ══════════════════════════════════════════
function spin() {
  if (isSpinning) return;
  isSpinning = true;
  spinBtn.disabled = true;
  spinCenterBtn.classList.add('disabled');
  canvas.classList.add('spinning');

  const n = CATEGORIES.length;
  const arc = (Math.PI * 2) / n;

  // 1. Pick random category
  const targetCatIdx = Math.floor(Math.random() * n);

  // 2. Compute exact rotation so the pointer (at top / 12 o'clock) lands
  //    within the center 65% of that segment — never near borders
  //    Segment i occupies angles from i*arc to (i+1)*arc in draw space (offset by -PI/2).
  //    Pointer reads at angle 0 (top). Wheel rotation is additive clockwise.
  //    So to put segment center under pointer: rotation = -(i*arc + arc/2)
  const segmentCenter = targetCatIdx * arc + arc / 2;
  const jitter = (Math.random() - 0.5) * arc * 0.6; // ±30% of arc — well inside
  const desiredAngle = -(segmentCenter + jitter);

  // 3. Add full spins and ensure we always go forward
  const minSpins = 6;
  let targetAngle = desiredAngle;
  while (targetAngle <= currentAngle + minSpins * Math.PI * 2) {
    targetAngle += Math.PI * 2;
  }

  const duration = 4500 + Math.random() * 2000;
  const startTime = performance.now();
  const startAngle = currentAngle;
  let lastNotch = -1;

  function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

  function animate(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = easeOutQuart(t);
    currentAngle = startAngle + (targetAngle - startAngle) * ease;
    drawWheel(currentAngle);

    // Notch tick
    const norm = ((currentAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const notch = Math.floor((norm / (Math.PI * 2)) * n * 3);
    if (notch !== lastNotch) {
      pointer.classList.remove('bounce');
      void pointer.offsetWidth;
      pointer.classList.add('bounce');
      lastNotch = notch;
    }

    if (t < 1) {
      requestAnimationFrame(animate);
    } else {
      canvas.classList.remove('spinning');
      showQuestion(targetCatIdx);
    }
  }

  requestAnimationFrame(animate);
}

spinBtn.addEventListener('click', spin);
spinCenterBtn.addEventListener('click', spin);

// ── QUESTION ──
function showQuestion(categoryIdx) {
  const cat = CATEGORIES[categoryIdx];
  const available = cat.questions.filter((_, i) => !usedQuestions[cat.name].includes(i));

  let qIdx, question;
  if (available.length === 0) {
    usedQuestions[cat.name] = [];
    qIdx = Math.floor(Math.random() * cat.questions.length);
    question = cat.questions[qIdx];
  } else {
    const randomAvail = Math.floor(Math.random() * available.length);
    question = available[randomAvail];
    qIdx = cat.questions.indexOf(question);
  }
  usedQuestions[cat.name].push(qIdx);

  const player = players[currentPlayerIdx];
  modalEmoji.textContent = cat.emoji;
  modalCategory.textContent = cat.name;
  modalCategory.style.color = cat.color;
  modalCard.style.borderTop = `4px solid ${cat.color}`;
  modalQuestion.textContent = question;
  modalPlayer.textContent = player;
  modal.classList.add('active');
  spawnConfetti(cat.color);
}

modalNextBtn.addEventListener('click', () => {
  modal.classList.remove('active');
  answeredCount[players[currentPlayerIdx]]++;
  currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
  updateTurnInfo();
  renderScoreboard();
  isSpinning = false;
  spinBtn.disabled = false;
  spinCenterBtn.classList.remove('disabled');
});

function updateTurnInfo() {
  currentPlayerName.textContent = players[currentPlayerIdx];
  currentPlayerName.style.color = playerColors[currentPlayerIdx % playerColors.length];
}

function renderScoreboard() {
  scoreRows.innerHTML = players.map((p, i) => {
    const isActive = i === currentPlayerIdx;
    return `<div class="score-row ${isActive ? 'active-player' : ''}">
      <div class="score-avatar" style="background:${playerColors[i % playerColors.length]}">${p.charAt(0).toUpperCase()}</div>
      <div class="score-name">${p}</div>
      <div class="score-count">${answeredCount[p] || 0} odpowiedzi</div>
    </div>`;
  }).join('');
}

function spawnConfetti(baseColor) {
  const colors = [baseColor, '#feca57', '#48dbfb', '#ff6b6b', '#ff9ff3', '#54a0ff'];
  for (let i = 0; i < 40; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.width = (6 + Math.random() * 8) + 'px';
    el.style.height = (6 + Math.random() * 8) + 'px';
    el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    el.style.animationDuration = (2 + Math.random() * 3) + 's';
    el.style.animationDelay = (Math.random() * 0.8) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }
}

window.addEventListener('resize', () => drawWheel(currentAngle));
drawWheel(0);
</script>
